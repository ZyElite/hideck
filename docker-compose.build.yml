name: hideck-image-build

services:
  hideck:
    image: yibaiba/hideck:${HIDECK_VERSION:-2.0.10}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      pull: true
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        VERSION: v${HIDECK_VERSION:-2.0.10}
        REVISION: ${HIDECK_REVISION:?HIDECK_REVISION is required}
        BUILDTIME: ${HIDECK_BUILDTIME:?HIDECK_BUILDTIME is required}
        ENABLE_UPX: ${HIDECK_ENABLE_UPX:-0}
      tags:
        - yibaiba/hideck:${HIDECK_MINOR_VERSION:-2.0}
        - yibaiba/hideck:${HIDECK_LATEST_TAG:-latest}
      provenance: false
      sbom: false
