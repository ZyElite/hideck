server:
  debug: false
  port: 7575
  https_port: 7576
  webrtc_udp_address: ":7580"
  tls_data_dir: data/tls
  # tls_cert_file 与 tls_key_file 同时设置时覆盖自动本地 CA 证书。
  tls_cert_file: ""
  tls_key_file: ""
  # 跨 NAT 时显式配置，例如 ["stun:stun.example.com:3478"]。
  ice_servers: []
  sms_rate_limit_disabled: false

system:
  # 仅 OpenWrt 使用：把已拨号的数据网卡动态映射到 netifd，其他系统必须保持 false。
  openwrt_dynamic_interfaces: false

web:
  username: admin
  password: admin

devices: []
# PC/SC 读卡器示例（Linux 需要 pcscd 与 libpcsclite.so.1）：
# - id: reader1
#   name: USB SIM reader
#   device_backend: pcsc
#   esim_transport: pcsc
#   pcsc_reader_name: Example Reader 00 00
#   pcsc_usb_path: 1-2
#   sim_pin_env: VOHIVE_SIM_PIN_READER1 # 只保存环境变量名，不要填写 PIN 明文

proxy:
  instances: []

vowifi:
  enabled: false

webhook:
  enabled: false
