server:
  debug: false
  port: 7575
  sms_rate_limit_disabled: false

system:
  # 仅 OpenWrt 使用：把已拨号的数据网卡动态映射到 netifd，其他系统必须保持 false。
  openwrt_dynamic_interfaces: false

web:
  username: admin
  password: admin

devices: []
# PC/SC 读卡器示例（Linux 需要 pcscd 与 libpcsclite.so.1）：
# - id: reader1
#   name: USB SIM reader
#   device_backend: pcsc
#   esim_transport: pcsc
#   pcsc_reader_name: Example Reader 00 00
#   pcsc_usb_path: 1-2
#   sim_pin_env: VOHIVE_SIM_PIN_READER1 # 只保存环境变量名，不要填写 PIN 明文

proxy:
  instances: []

vowifi:
  enabled: false

webhook:
  enabled: false
