services:
  hideck:
    env_file:
      - ./hideck-caddy.env

  caddy:
    image: caddy:2-alpine
    container_name: hideck-caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - hideck
    env_file:
      - ./caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
