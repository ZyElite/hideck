openapi: 3.0.3
info:
  title: HiDeck Main API
  version: 1.0.0-main
  description: |
    HiDeck 主服务控制面 API。
    - 服务器前缀：`/api`
    - 登录方式：`POST /auth/login`
    - 受保护接口统一使用 `Authorization: Bearer <token>`
    - 文档页面：`GET /docs`
servers:
  - url: /api
    description: HiDeck main API prefix
security:
  - BearerAuth: []
tags:
  - name: auth
    description: 登录、会话与 IP 轮换
  - name: dashboard
    description: 仪表盘与全局状态
  - name: sms
    description: 短信收发与会话
  - name: settings
    description: 系统信息、密码与通知设置
  - name: devices
    description: 设备配置、控制与运维
  - name: proxy-instances
    description: 本地代理实例管理
  - name: upstream-proxies
    description: 前置代理与国家规则
  - name: esim
    description: eSIM 与 eUICC 管理
  - name: vowifi
    description: VoWiFi 控制
  - name: logs
    description: 日志历史与实时流
  - name: automatic-tasks
    description: eSIM 自动任务与运行记录
  - name: phone
    description: VoWiFi 浏览器实时电话、媒体、事件与录音
paths:
  /docs:
    get:
      tags: [settings]
      summary: Swagger UI 文档页
      description: |
        公开可访问的文档壳页面。
        页面本身不要求 Bearer 鉴权，但会在浏览器内读取 `localStorage.token`，
        再用 Bearer 方式请求 `/openapi.json` 并给 Try it out 自动注入认证头。
      security: []
      responses:
        '200':
          description: HTML 页面
          content:
            text/html:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [settings]
      summary: 获取 OpenAPI YAML
      responses:
        '200':
          description: OpenAPI YAML 文档
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /openapi.json:
    get:
      tags: [settings]
      summary: 获取 OpenAPI JSON
      responses:
        '200':
          description: OpenAPI JSON 文档
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/ErrorMessage'

  /rotateip:
    post:
      tags: [auth]
      summary: 执行公网 IP 轮换
      description: |
        支持两种鉴权方式：
        1. Bearer token
        2. 请求体或表单里的 `username/password`
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RotateRequest'
      parameters:
        - in: query
          name: device_id
          schema:
            type: string
          description: 优先级高于请求体中的 device_id
      responses:
        '200':
          description: 轮换结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /dashboard/devices:
    get:
      tags: [dashboard]
      summary: 仪表盘设备概览
      responses:
        '200':
          description: 设备卡片列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardDevice'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{device_id}/status:
    get:
      tags: [dashboard]
      summary: 单设备详细状态
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      responses:
        '200':
          description: 详细状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /health:
    get:
      tags: [dashboard]
      summary: 服务健康检查
      responses:
        '200':
          description: 所有设备健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 至少一个设备不健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /traffic/analysis:
    get:
      tags: [dashboard]
      summary: 流量统计分析
      parameters:
        - in: query
          name: range
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
        - in: query
          name: device_id
          schema:
            type: string
      responses:
        '200':
          description: 聚合流量与图表数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficAnalysisResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sms/send:
    post:
      tags: [sms]
      summary: 发送短信
      description: device_id、imsi、iccid 三种设备选择器只能指定一个；共享 IMSI 场景应使用 iccid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMSSendRequest'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSSendResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '503':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /sms/delivery/{message_id}:
    get:
      tags: [sms]
      summary: 查询短信投递状态
      parameters:
        - in: path
          name: message_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 投递状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSDeliveryResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /sms/contacts:
    get:
      tags: [sms]
      summary: 短信联系人会话列表
      parameters:
        - in: query
          name: device_id
          schema:
            type: string
        - in: query
          name: imsi
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: before_ts
          schema:
            type: string
            format: date-time
        - in: query
          name: before_peer
          schema:
            type: string
      responses:
        '200':
          description: 联系人列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SMSContact'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /sms/thread:
    get:
      tags: [sms]
      summary: 获取与指定对端的短信会话
      parameters:
        - in: query
          name: iccid
          description: 会话 ICCID；不能与 device_id 或 imsi 同时使用
          schema:
            type: string
        - in: query
          name: device_id
          schema:
            type: string
        - in: query
          name: imsi
          schema:
            type: string
        - in: query
          name: peer
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: before_ts
          schema:
            type: string
            format: date-time
        - in: query
          name: before_id
          schema:
            type: integer
      responses:
        '200':
          description: 短信会话消息列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SMSMessage'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'
    patch:
      tags: [sms]
      summary: 持久化短信会话已读进度
      description: 仅将 through_id 及之前的已展示来信标为已读，之后到达的短信保持未读
      parameters:
        - in: query
          name: iccid
          required: true
          schema:
            type: string
        - in: query
          name: peer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [through_id]
              properties:
                through_id:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 会话已读状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked:
                    type: integer
                  unread_count:
                    type: integer
                  through_id:
                    type: integer
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'
    delete:
      tags: [sms]
      summary: 永久删除指定短信会话历史
      description: 仅删除短信中心历史记录，不删除设备侧短信槽位
      parameters:
        - in: query
          name: iccid
          description: 会话 ICCID；不能与 device_id 或 imsi 同时使用
          schema:
            type: string
        - in: query
          name: device_id
          schema:
            type: string
        - in: query
          name: imsi
          schema:
            type: string
        - in: query
          name: peer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  deleted:
                    type: integer
                  iccid:
                    type: string
                  peer:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /sms/messages/{id}:
    delete:
      tags: [sms]
      summary: 永久删除单条短信历史
      description: 仅删除短信中心历史记录，不删除设备侧短信槽位
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  thread_empty:
                    type: boolean
                  imsi:
                    type: string
                  peer:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications:
    get:
      tags: [settings]
      summary: 获取通知设置
      responses:
        '200':
          description: 当前通知配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
    put:
      tags: [settings]
      summary: 保存通知设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationSettingsRequest'
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedResult'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/system:
    get:
      tags: [settings]
      summary: 获取系统设置
      responses:
        '200':
          description: 当前系统设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
    put:
      tags: [settings]
      summary: 更新系统设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettings'
      responses:
        '200':
          description: 设置已持久化并应用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedResult'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '422':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/disclaimer:
    get:
      tags: [settings]
      summary: 获取免责声明同意状态
      description: 从 HiDeck 数据库读取当前免责声明版本的全局同意状态。
      responses:
        '200':
          description: 当前数据库中的同意状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclaimerStatus'
        '503':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'
    put:
      tags: [settings]
      summary: 同意当前免责声明
      description: 把当前免责声明版本及服务端接受时间持久化到 HiDeck 数据库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptDisclaimerRequest'
      responses:
        '200':
          description: 已持久化同意状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclaimerStatus'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '503':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/webhook/test:
    post:
      tags: [settings]
      summary: 使用当前 Webhook 配置发送测试通知（不落盘）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestWebhookRequest'
      responses:
        '200':
          description: 测试发送结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestWebhookResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/wecom/test:
    post:
      tags: [settings]
      summary: 使用当前企业微信配置发送测试通知（不落盘）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestWeComRequest'
      responses:
        '200':
          description: 测试发送结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestWeComResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/weixin/qr/start:
    post:
      tags: [settings]
      summary: 开始微信二维码登录会话
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWeixinQRRequest'
      responses:
        '200':
          description: 二维码会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeixinQRStartResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '502':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/weixin/qr/status:
    get:
      tags: [settings]
      summary: 查询微信二维码会话状态
      parameters:
        - in: query
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 二维码状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeixinQRStatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '502':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/weixin/qr/cancel:
    post:
      tags: [settings]
      summary: 取消微信二维码会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelWeixinQRRequest'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/wecom-bot/qr/start:
    post:
      tags: [settings]
      summary: 开始企业微信长连接机器人二维码会话
      description: 扫码服务不可用时返回 502，并明确允许改用 Bot ID 和 Secret 手工配置。
      responses:
        '200':
          description: 二维码会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeComBotQRResponse'
        '502':
          $ref: '#/components/responses/QROnboardingError'

  /settings/notifications/wecom-bot/qr/status:
    get:
      tags: [settings]
      summary: 查询企业微信长连接机器人二维码状态
      parameters:
        - $ref: '#/components/parameters/QRSessionID'
      responses:
        '200':
          description: 二维码状态；确认后凭证已尝试写入配置，Secret 不会返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeComBotQRResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '502':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/wecom-bot/qr/cancel:
    post:
      tags: [settings]
      summary: 取消企业微信长连接机器人二维码会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelQRRequest'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/qq/qr/start:
    post:
      tags: [settings]
      summary: 开始 QQ Bot 扫码注册会话
      description: 创建 source=vohive 的 QQ Lite 绑定任务；扫码服务不可用时可改用 App ID、App Secret 和 OpenID 手工配置。
      responses:
        '200':
          description: 二维码会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QQQRResponse'
        '502':
          $ref: '#/components/responses/QROnboardingError'

  /settings/notifications/qq/qr/status:
    get:
      tags: [settings]
      summary: 查询 QQ Bot 扫码注册状态
      parameters:
        - $ref: '#/components/parameters/QRSessionID'
      responses:
        '200':
          description: 二维码状态；确认后 App Secret 已尝试写入配置但不会返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QQQRResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '502':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/qq/qr/cancel:
    post:
      tags: [settings]
      summary: 取消 QQ Bot 扫码注册会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelQRRequest'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /settings/password:
    post:
      tags: [settings]
      summary: 修改登录密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /system/info:
    get:
      tags: [settings]
      summary: 获取系统信息与文档入口
      responses:
        '200':
          description: 系统信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /system/time:
    get:
      tags: [settings]
      summary: 获取设备当前时间和时区
      responses:
        '200':
          description: 设备时间快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemTimeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices:
    get:
      tags: [devices]
      summary: 设备管理列表
      responses:
        '200':
